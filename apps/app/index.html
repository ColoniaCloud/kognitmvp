<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#2E6F9E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kognit" />
    <!-- Mismo manifest que el sitio, servido desde la raíz: una sola identidad de
         PWA para todo el origin (ver apps/app/vite.config.ts). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Kognit</title>
    <meta name="description" content="La ventaja está en tu mente. Reset mental en segundos para jugadores de poker." />
    <!-- La app es privada y va detrás de login: no tiene por qué aparecer en buscadores
         (el robots.txt del sitio ya lo cubre, esto es defensa en profundidad). -->
    <meta name="robots" content="noindex, nofollow" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
